{openapi: 3.1.0,
   info: {title: Verzel Auction House API,
     version: 1.0.0,
     description: Local auction backend. Integer cents are strings. Protected operations require Bearer access token; roles enforced server-side. Strict query/body validation. Settlement is automatic; there is no manual settlement or administrator API.},
   servers: [{url: /,
       description: Current API server}],
   security: [],
   paths: {/auth/login: {post: {summary: Authenticate seeded account,
         operationId: post_auth_login,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/Login"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginInput"}}}},
         tags: [Authentication]}},
