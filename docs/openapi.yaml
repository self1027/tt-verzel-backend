     "/catalog/products/{id}": {get: {summary: Local snapshot details,
         operationId: get_catalog_products_id,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {product: {$ref: "#/components/schemas/ProductSnapshot"}}, required: [product], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/Id"}],
         tags: [Catalog]}},
     /wallet: {get: {summary: Own balance and reservations,
         operationId: get_wallet,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {wallet: {$ref: "#/components/schemas/Wallet"}}, required: [wallet], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         tags: [Wallets]}},
     /wallet/transactions: {get: {summary: Own financial history,
         operationId: get_wallet_transactions,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/WalletHistory"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}],
         tags: [Wallets]}},
     /wallet/deposits: {post: {summary: Simulated deposit,
         operationId: post_wallet_deposits,
         security: [{bearerAuth: []}],
         responses: {"201": {description: Success, content: {application/json: {schema: {type: object, properties: {deposit: {$ref: "#/components/schemas/Deposit"}}, required: [deposit], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: BIDDER,
         parameters: [{$ref: "#/components/parameters/IdempotencyKey"}],
         requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AmountInput"}}}},
         tags: [Wallets]}},
     /auctions: {get: {summary: Search local auctions,
         operationId: get_auctions,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/AuctionPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}, {name: q, in: query, schema: {type: string}, description: "Case-insensitive literal substring in stored productSnapshot.title, including literal %, _ and backslash. Empty matches every title."}, {name: lifecycleState, in: query, schema: {type: string, enum: [SCHEDULED, LIVE, FINALIZING, CANCELLED, SETTLED, CLOSED_NO_BIDS]}}, {name: minPriceCents, in: query, schema: {$ref: "#/components/schemas/NonnegativeCents"}, description: Inclusive own-auction current bid amount or starting bid; exact BIGINT comparison.}, {name: maxPriceCents, in: query, schema: {$ref: "#/components/schemas/NonnegativeCents"}, description: Inclusive current price bound; must be >= minPriceCents.}, {name: sort, in: query, schema: {type: string, enum: [price_asc, price_desc, endsAt_asc, endsAt_desc]}, description: "All ties use id ASC. Default createdAt DESC, id ASC."}, {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 2147483648}, description: One-based. Cannot coexist with skip. (page-1)*limit must not exceed 2147483647.}],
         description: "All filters combine with AND before count and pagination. Rows/total share a read-only REPEATABLE READ snapshot and asOf. Unknown/repeated query keys rejected. No lifecycle filter includes terminal lots. page is translated to skip, not echoed.",
         tags: [Auctions]},
       post: {summary: Publish future auction,
         operationId: post_auctions,
         security: [{bearerAuth: []}],
         responses: {"201": {description: Success, content: {application/json: {schema: {type: object, properties: {auction: {$ref: "#/components/schemas/Auction"}}, required: [auction], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: AUCTIONEER,
         requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAuction"}}}},
         description: "Existing local productSnapshotId; startsAt must be in future, endsAt after startsAt, at most milliseconds precision.",
         tags: [Auctions]}},
     /auctions/mine: {get: {summary: Own auctions with the same search filters,
         operationId: get_auctions_mine,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/AuctionPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: AUCTIONEER,
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}, {name: q, in: query, schema: {type: string}, description: "Case-insensitive literal substring in stored productSnapshot.title, including literal %, _ and backslash. Empty matches every title."}, {name: lifecycleState, in: query, schema: {type: string, enum: [SCHEDULED, LIVE, FINALIZING, CANCELLED, SETTLED, CLOSED_NO_BIDS]}}, {name: minPriceCents, in: query, schema: {$ref: "#/components/schemas/NonnegativeCents"}, description: Inclusive own-auction current bid amount or starting bid; exact BIGINT comparison.}, {name: maxPriceCents, in: query, schema: {$ref: "#/components/schemas/NonnegativeCents"}, description: Inclusive current price bound; must be >= minPriceCents.}, {name: sort, in: query, schema: {type: string, enum: [price_asc, price_desc, endsAt_asc, endsAt_desc]}, description: "All ties use id ASC. Default createdAt DESC, id ASC."}, {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 2147483648}, description: One-based. Cannot coexist with skip. (page-1)*limit must not exceed 2147483647.}],
         description: "All filters combine with AND before count and pagination. Rows/total share a read-only REPEATABLE READ snapshot and asOf. Unknown/repeated query keys rejected. No lifecycle filter includes terminal lots. page is translated to skip, not echoed.",
         tags: [Auctions]}},
     "/auctions/{id}": {get: {summary: Public auction details,
         operationId: get_auctions_id,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {auction: {$ref: "#/components/schemas/Auction"}}, required: [auction], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/Id"}],
         tags: [Auctions]},
       patch: {summary: Edit own future published auction without bids,
         operationId: patch_auctions_id,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {auction: {$ref: "#/components/schemas/Auction"}}, required: [auction], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: AUCTIONEER,
         parameters: [{$ref: "#/components/parameters/Id"}],
         requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EditAuction"}}}},
         tags: [Auctions]}},
     "/auctions/{id}/cancel": {post: {summary: Cancel own unexpired published auction without bids,
         operationId: post_auctions_id_cancel,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {auction: {$ref: "#/components/schemas/Auction"}}, required: [auction], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: AUCTIONEER,
         parameters: [{$ref: "#/components/parameters/Id"}],
         requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {}, required: [], additionalProperties: false}}}},
         description: No bidder-reserve cancellation or admin role. Started auctions without bids may be cancelled before endsAt. An existing current bid or actual bid history prevents cancellation. Empty body or no body accepted.,
         tags: [Auctions]}},
     "/auctions/{auctionId}/bids": {get: {summary: Public bid history with current leader,
         operationId: get_auctions_auctionId_bids,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/PublicBidPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/AuctionId"}, {$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}],
         tags: [Bids]},
       post: {summary: Place an idempotent live bid,
         operationId: post_auctions_auctionId_bids,
         security: [{bearerAuth: []}],
         responses: {"201": {description: Success, content: {application/json: {schema: {type: object, properties: {bid: {$ref: "#/components/schemas/BidReceipt"}}, required: [bid], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: BIDDER,
         parameters: [{$ref: "#/components/parameters/AuctionId"}, {$ref: "#/components/parameters/IdempotencyKey"}],
         requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AmountInput"}}}},
         description: Requires LIVE auction and available funds; reserves funds and releases displaced leader atomically. Current leader cannot rebid. Anti-sniping extends deadline per accepted bid; response endsAt is immutable for retries.,
         tags: [Bids]}},
     /auctions/bids/mine: {get: {summary: Own bids and current leading state,
         operationId: get_auctions_bids_mine,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/OwnBidPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         x-required-role: BIDDER,
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}],
         tags: [Bids]}},
     "/auctions/{id}/audit": {get: {summary: Verify local history against independent witness,
         operationId: get_auctions_id_audit,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/AuditVerification"}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}, "503": {description: Verification unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/AuditVerification"}}}}},
         parameters: [{$ref: "#/components/parameters/Id"}],
         description: No query parameters. VERIFIED requires full operational replay and matching independent latest head. PENDING_ANCHOR is not external verification. TAMPERED reports corruption; unavailable witness yields HTTP503. Does not disclose identities.,
         tags: [Audit]}},
     "/auctions/{id}/audit/events": {get: {summary: Cursor page of public audit events,
         operationId: get_auctions_id_audit_events,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/AuditPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/limit"}, {name: after, in: query, schema: {$ref: "#/components/schemas/NonnegativeCents"}, description: "Exclusive event sequence cursor, default 0. EVENT_PAGE_ONLY is not verification."}],
         tags: [Audit]}},
     "/auctions/{id}/receipt": {get: {summary: Shareable persisted financial receipt,
         operationId: get_auctions_id_receipt,
         security: [],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {receipt: {$ref: "#/components/schemas/PublicReceipt"}}, required: [receipt], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/Id"}],
         description: "Public, no query parameters, Cache-Control:no-store. 404 until financial settlement exists (including CLOSED_NO_BIDS); 409 when persisted financial records are inconsistent. Pseudonymous winning bidder; no email, userId, wallet IDs or receipt token. Receipt presence does not imply witness verification; consult auditUrl.",
         tags: [Receipts]}}},
   components: {securitySchemes: {bearerAuth: {type: http,
         scheme: bearer,
         bearerFormat: JWT}},
     parameters: {limit: {name: limit,
         in: query,
         schema: {type: integer, minimum: 1, maximum: 100, default: 30}},
       skip: {name: skip,
         in: query,
         schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}},
       Id: {name: id,
         in: path,
         required: true,
         schema: {type: string, format: uuid}},
       ExternalId: {name: id,
         in: path,
         required: true,
         schema: {type: integer, minimum: 1}},
       AuctionId: {name: auctionId,
         in: path,
         required: true,
         schema: {type: string, format: uuid}},
       IdempotencyKey: {name: Idempotency-Key,
         in: header,
         required: true,
         schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"},
         description: Exactly one header. Reuse the key for retries of the same operation; changed amounts conflict.}},
     schemas: {NonnegativeCents: {type: string,
         pattern: "^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$",
         maxLength: 19,
