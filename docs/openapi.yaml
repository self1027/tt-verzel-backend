         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}, {name: category, in: query, schema: {type: string, maxLength: 100, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}}],
         tags: [Catalog]}},
     /catalog/external/search: {get: {summary: Search external catalog,
         operationId: get_catalog_external_search,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalProductPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}, "504": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}, {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}],
         tags: [Catalog]}},
     "/catalog/external/{id}": {get: {summary: External product details,
         operationId: get_catalog_external_id,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {product: {$ref: "#/components/schemas/ExternalProduct"}}, required: [product], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}, "504": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/ExternalId"}],
         tags: [Catalog]}},
     /catalog/categories: {get: {summary: External category slugs,
         operationId: get_catalog_categories,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: array, items: {type: string}}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}, "504": {$ref: "#/components/responses/Error"}},
         tags: [Catalog]}},
     "/catalog/import/{id}": {post: {summary: Import local product snapshot,
         operationId: post_catalog_import_id,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {type: object, properties: {product: {$ref: "#/components/schemas/ProductSnapshot"}, created: {type: boolean}}, required: [product, created], additionalProperties: false}}}}, "201": {description: Success, content: {application/json: {schema: {type: object, properties: {product: {$ref: "#/components/schemas/ProductSnapshot"}, created: {type: boolean}}, required: [product, created], additionalProperties: false}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}, "504": {$ref: "#/components/responses/Error"}},
         x-required-role: AUCTIONEER,
         parameters: [{$ref: "#/components/parameters/ExternalId"}],
         requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {}, required: [], additionalProperties: false}}}},
         description: 201 when imported; 200 with created=false on existing import. Empty JSON body or no body accepted.,
         tags: [Catalog]}},
     /catalog/products: {get: {summary: List local snapshots,
         operationId: get_catalog_products,
         security: [{bearerAuth: []}],
         responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ProductPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "500": {$ref: "#/components/responses/Error"}},
         parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/skip"}],
